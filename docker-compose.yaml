version: '3.9'

services:
  web:
    build: .
    command: >
      sh -c "sleep 10 &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --log-level debug"
    volumes:
      - .:/code
    expose:
      - "8000"
    env_file:
      - .env

  nginx:
    image: nginx:latest
    ports:
      - "8888:80"
    volumes:
      - ./nginx/custom.conf:/etc/nginx/conf.d/custom.conf  # Changed path
      - ./static:/code/static
      - ./media:/code/media  # Changed from /home/media to ./media
    depends_on:
      - web