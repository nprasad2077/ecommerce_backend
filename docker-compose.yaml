version: "3.9"

services:
  web:
    build: .
    command: >
      sh -c "sleep 10 &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --log-level debug"
    volumes:
      - .:/code
      - root/media:/code/media
    ports:
      - "8888:8000"
    env_file:
      - .env