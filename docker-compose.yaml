version: '3.9'

services:
  web:
    build: .
    container_name: ecommerce-web  # Fixed name
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py create_demo_data || true &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/code/static
      - media_volume:/code/media
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: ecommerce-nginx  # Fixed name
    ports:
      - "8888:80"
    volumes:
      - static_volume:/code/static
      - media_volume:/code/media
    depends_on:
      - web
    networks:
      - app-network

volumes:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge