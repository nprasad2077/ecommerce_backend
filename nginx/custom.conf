server {
    listen 80;
    server_name django.server.nbaapi.com;

    # Static files
    location /static/ {
        alias /code/static/;
        autoindex off;
    }

    # Media files
    location /media/ {
        alias /code/media/;
        autoindex off;
    }

    # Django application
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}